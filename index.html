<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>منيو مينج برجر · القنطرة شرق</title>
    <meta name="description" content="منيو مينج برجر فرع القنطرة شرق، أمام جامعة سيناء. فطار وغدا، برجر، سماش، وبوكسات.">
    <meta name="theme-color" content="#E3262B">
    <meta property="og:title" content="منيو مينج برجر · القنطرة شرق">
    <meta property="og:description" content="فطار وغدا، أمام جامعة سيناء">
    <meta property="og:image" content="icons/icon-512.png">
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;700&family=Bebas+Neue&display=swap">
    <link rel="preload" as="image" href="logo.png">
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div class="hero-inner">
          <div class="logo-badge"><img src="logo.png" alt="Ming Burger" width="240" height="100"></div>
          <div class="hero-text">
            <h1 id="branch-name"></h1>
            <p id="branch-landmark"></p>
          </div>
          <button type="button" class="icon-btn on-red" id="theme-btn"></button>
        </div>
        <div class="checker" aria-hidden="true"></div>
      </header>

      <div class="bar" id="bar">
        <div class="bar-row">
          <div class="toggle" id="menu-toggle" role="group" aria-label="اختار المنيو"></div>
          <button type="button" class="icon-btn" id="search-btn" aria-label="دوّر في المنيو"></button>
          <div class="search-field">
            <input id="search" type="search" placeholder="دوّر على صنف… زنجر، سماش، تركي" autocomplete="off" aria-label="دوّر في المنيو">
            <button type="button" class="icon-btn" id="search-close" aria-label="قفل البحث"></button>
          </div>
        </div>
        <p class="status" id="status" aria-live="polite"></p>
        <nav class="chips" id="chips" aria-label="أقسام المنيو"></nav>
      </div>

      <div class="tools">
        <button type="button" class="tool" id="tool-budget">
          <span class="tool-ico"></span>
          <span><b>معاك كام؟</b><small>تاخد إيه بفلوسك</small></span>
        </button>
        <button type="button" class="tool" id="tool-random">
          <span class="tool-ico"></span>
          <span><b>اختارلي</b><small>محتار تاكل إيه؟</small></span>
        </button>
      </div>

      <main id="menu"></main>

      <footer class="footer" id="footer"></footer>
    </div>

    <button type="button" class="cart-bar" id="cart-bar" hidden></button>
    <div class="toast" id="toast" role="status"></div>
    <dialog id="sheet" class="sheet" aria-label="تفاصيل"></dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
